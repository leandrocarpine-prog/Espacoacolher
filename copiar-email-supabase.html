<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Modelo de e-mail | Espaço Acolher</title>
  <style>
    :root{color-scheme:light;--ink:#173247;--blue:#2d708f;--line:#cfe1e9;--bg:#edf5f9}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink);padding:20px}
    main{max-width:720px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 18px 45px rgba(23,50,71,.1)}
    h1{font-size:26px;margin:0 0 8px}
    p{color:#607789;line-height:1.5}
    label{display:block;font-weight:700;margin:22px 0 8px}
    input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px;font:14px/1.45 monospace;background:#f8fbfc;color:var(--ink)}
    textarea{min-height:270px;resize:vertical}
    button,.action{display:block;width:100%;border:0;border-radius:12px;padding:15px;margin-top:10px;background:var(--blue);color:#fff;font-weight:700;font-size:16px;text-align:center;text-decoration:none}
    .action{background:#173247;margin-top:18px}
    .steps{background:#f2f8fa;border-radius:14px;padding:16px 18px;margin:18px 0;color:#425f72;line-height:1.6}
    .status{min-height:24px;margin:12px 0 0;text-align:center;color:#18774a;font-weight:700}
  </style>
</head>
<body>
  <main>
    <h1>E-mail de ativação</h1>
    <p>Use os botões abaixo para copiar e colar no modelo <strong>Confirm signup</strong> do Supabase.</p>
    <div class="steps"><strong>Como fazer no celular:</strong><br>1. Copie o assunto.<br>2. Copie o modelo completo.<br>3. Toque em “Abrir Supabase”.<br>4. Cole nos dois campos e salve.</div>

    <label for="subject">Assunto</label>
    <input id="subject" readonly value="Ative sua conta | Espaço Acolher">
    <button type="button" data-copy="subject">Copiar assunto</button>

    <label for="body">Conteúdo HTML</label>
    <textarea id="body" readonly><!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;background:#edf5f9;font-family:Arial,sans-serif;color:#173247">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#edf5f9;padding:28px 12px"><tr><td align="center">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:620px;background:#ffffff;border:1px solid #d3e4eb;border-radius:22px;overflow:hidden">
      <tr><td style="padding:28px 32px;background:#2c6e8d;color:#ffffff">
        <div style="font-size:12px;letter-spacing:2px;font-weight:bold">ESPAÇO ACOLHER</div>
        <div style="font-size:28px;line-height:1.2;font-weight:bold;margin-top:10px">Confirme seu e-mail</div>
      </td></tr>
      <tr><td style="padding:32px">
        <p style="font-size:18px;margin:0 0 14px">Olá, {{ .Data.full_name }}.</p>
        <p style="font-size:15px;line-height:1.65;color:#607789;margin:0 0 22px">Recebemos seu cadastro no Espaço Acolher. Para proteger seus dados, o acesso só será liberado depois que você confirmar este endereço de e-mail.</p>
        <p style="text-align:center;margin:26px 0"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#2d708f;color:#ffffff;text-decoration:none;font-weight:bold;padding:15px 24px;border-radius:12px">Confirmar e ativar minha conta</a></p>
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f2f8fa;border-radius:14px;margin:24px 0"><tr><td style="padding:18px">
          <div style="font-size:12px;color:#3f87a4;font-weight:bold;letter-spacing:1px">SEU ACESSO</div>
          <div style="font-size:14px;margin-top:8px"><b>Usuário:</b> {{ .Data.username }}</div>
          <div style="font-size:13px;color:#607789;margin-top:5px">Use a senha que você criou. Por segurança, ela nunca é enviada por e-mail.</div>
        </td></tr></table>
        <div style="font-size:14px;font-weight:bold;margin-bottom:10px">Depois de ativar:</div>
        <ol style="padding-left:20px;color:#607789;font-size:14px;line-height:1.7;margin-top:0">
          <li>Entre na sua conta.</li>
          <li>Abra sua primeira solicitação de atendimento.</li>
          <li>Informe para quem é o atendimento e o assunto principal.</li>
          <li>Conte brevemente, com suas próprias palavras, o motivo da procura.</li>
          <li>Revise, envie e acompanhe as atualizações em “Minha área”.</li>
        </ol>
        <p style="font-size:13px;line-height:1.55;color:#607789;margin:24px 0 0">Se o botão não abrir, copie este endereço no navegador:<br><a href="{{ .ConfirmationURL }}" style="color:#2d708f;word-break:break-all">{{ .ConfirmationURL }}</a></p>
      </td></tr>
      <tr><td style="padding:20px 32px;background:#f7fafb;color:#718795;font-size:12px;line-height:1.5">Espaço Acolher · Psicologia e cuidado<br>Este e-mail foi enviado porque um cadastro foi criado com este endereço.</td></tr>
    </table>
  </td></tr></table>
</body>
</html></textarea>
    <button type="button" data-copy="body">Copiar modelo completo</button>
    <a class="action" href="https://supabase.com/dashboard/project/lunnyaxxkineezrsclbx/auth/templates">Abrir Supabase para colar e salvar →</a>
    <div class="status" role="status" aria-live="polite"></div>
  </main>
  <script>
    const status = document.querySelector('.status');
    document.querySelectorAll('[data-copy]').forEach((button) => {
      button.addEventListener('click', async () => {
        const field = document.getElementById(button.dataset.copy);
        try {
          await navigator.clipboard.writeText(field.value);
        } catch (_) {
          field.focus();
          field.select();
          document.execCommand('copy');
        }
        status.textContent = 'Copiado. Agora volte ao Supabase e cole no campo correspondente.';
      });
    });
  </script>
</body>
</html>
