name: Android Espaço Acolher
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['acolher-app/android/**', '.github/workflows/android-preview.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK Android do servidor
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar e verificar aplicativo
        working-directory: acolher-app/android
        run: gradle :app:assembleDebug :app:lintDebug --no-daemon
      - name: Preparar instalador
        run: cp acolher-app/android/app/build/outputs/apk/debug/app-debug.apk Espaco-Acolher-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Espaco-Acolher-Android
          path: Espaco-Acolher-Android.apk
      - name: Publicar versão de avaliação
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-preview-${GITHUB_RUN_NUMBER}" Espaco-Acolher-Android.apk --title "Espaco Acolher Android - notificacoes ${GITHUB_RUN_NUMBER}" --notes "Versao 0.2.0 com Firebase. Entre como administrador e abra Gestao > Ativar notificacoes neste celular. Requer internet e permissao Android. Entrega no aparelho ainda precisa ser confirmada. APK de avaliacao; atualizacao pode exigir reinstalacao." --prerelease --target "$GITHUB_SHA"
