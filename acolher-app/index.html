<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2d708f"><title>Espaço Acolher · Administrativo</title><link rel="stylesheet" href="app.css?v=4"><link rel="stylesheet" href="modern.css?v=1"><link rel="stylesheet" href="executive.css?v=1"></head>
<body><main id="login" class="login"><div class="mark">EA</div><p class="eyebrow">SEU ESPAÇO DE GESTÃO</p><h1>Espaço<br>Acolher</h1><p>Acompanhe o cuidado, desde o primeiro contato.</p><form id="login-form"><label>E-mail ou usuário administrador<input name="username" autocomplete="username" required></label><label>Senha<div class="password"><input name="password" type="password" autocomplete="current-password" required><button type="button" id="eye" aria-label="Mostrar senha">Ver</button></div></label><button class="primary" type="submit">Entrar no meu espaço →</button><p id="login-message" role="status"></p></form><small>Seu acesso é definido pelo perfil da sua conta.</small></main>
<div id="shell" hidden><header><div><span class="eyebrow">ESPAÇO ACOLHER</span><h1 id="greeting">Olá, Leandro.</h1></div><button id="refresh" aria-label="Atualizar dados">↻</button></header><p id="message" role="status"></p><main id="content"></main><nav aria-label="Navegação principal"><button data-view="home" class="active">⌂<span>Painel</span></button><button data-view="patients">◎<span>Pacientes</span></button><button data-view="professionals">◇<span>Profissionais</span></button><button data-view="more">•••<span>Gestão</span></button></nav></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="push.js?v=2"></script><script src="app.js?v=11"></script></body></html>
